name: CustomWeapons
version: 1.0.0
main: com.customweapons.CustomWeaponsPlugin
api-version: '1.21'
author: YourName
description: Custom mace/spear/bow abilities - Earthmace, Venom Spear, Pull Bow, Astral Mace

commands:
  earthquake:
    description: Gives the Earthmace (op only)
    usage: /earthquake
    permission: customweapons.admin
  venomspear:
    description: Gives the Venom Spear (op only)
    usage: /venomspear
    permission: customweapons.admin
  pullbow:
    description: Gives the Pull Bow (op only)
    usage: /pullbow
    permission: customweapons.admin
  astralmace:
    description: Gives the Astral Mace (op only)
    usage: /astralmace
    permission: customweapons.admin

permissions:
  customweapons.admin:
    description: Allows giving yourself the custom weapons
    default: op
